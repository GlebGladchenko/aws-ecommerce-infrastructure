# cfn-lint configuration - https://github.com/aws-cloudformation/cfn-lint
# Used by scripts/validate.sh and .github/workflows/validate-infrastructure.yml.
templates:
  - cloudformation/**/*.yml

# The project deploys to us-east-2. The CloudFront-scoped WAF web ACL must live
# in us-east-1 (see cloudformation/networking/waf.yml), so lint for both.
regions:
  - us-east-2
  - us-east-1

# Template-specific suppressions live in each template's
# Metadata.cfn-lint.config block, next to the reason for them.
