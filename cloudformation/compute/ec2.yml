AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  [PLACEHOLDER - NOT DEPLOYABLE] AWS E-Commerce Infrastructure - EC2 launch
  template for application hosts that run the FastAPI container image (built
  from app/) pulled from Amazon ECR.

Metadata:
  ImplementationStatus: PLACEHOLDER
  cfn-lint:
    config:
      ignore_checks:
        - W2001 # TODO: remove once real resources consume the parameters

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Project prefix for resource names.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.
  AppInstanceType:
    Type: String
    Description: EC2 instance type.
  AppContainerPort:
    Type: Number
    Description: Port the application container listens on.
  LogRetentionDays:
    Type: Number
    Description: Retention for the application log group.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI, resolved from the public SSM parameter.
  # TODO: AppSecurityGroupId, InstanceProfileArn, EcrRepositoryUri,
  #       AppSecretArn, DbMasterSecretArn, DbEndpointAddress, AppImageTag

# TODO: Planned resources
