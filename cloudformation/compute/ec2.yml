#     TagSpecifications  instance + volume tags (Name, Component)
#   AppLogGroup        /<project>/<env>/app, RetentionInDays: LogRetentionDays
Resources:
  PlaceholderResource:
    Type: AWS::CloudFormation::WaitConditionHandle

