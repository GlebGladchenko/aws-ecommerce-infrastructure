AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS E-Commerce Infrastructure - internet-facing Application Load Balancer in
  the public subnets of both AZs, with a target group for the FastAPI
  application instances.

# -----------------------------------------------------------------------------
# Listener
#   Exactly one listener, on the same port the ALB security group admits
#   (main.yml derives AlbIngressPort from the same condition):
#     AlbCertificateArn empty -> HTTP 80, forward to the target group
#     AlbCertificateArn set   -> HTTPS 443 (TLS 1.2/1.3 policy), forward
#   There is no HTTP->HTTPS redirect listener: the security group admits a
#   single port, and CloudFront does the viewer redirect.
#
# Target group
#   HTTP on AppContainerPort (8080), instance targets registered by the Auto
#   Scaling group, health check GET AppHealthCheckPath -> 200. A healthy target
#   needs 2 passes 15 s apart (~30 s); an unhealthy one is removed after 3
#   failures (~45 s). The target group has no fixed name, so a change that
#   requires replacement (e.g. the port) cannot fail on a name clash.
#
# TODO (full stage): access logs to StorageStack's logs bucket, and a listener
# rule that rejects requests without CloudFront's secret origin header.
# -----------------------------------------------------------------------------

Metadata:
  # Checked by scripts/deploy.sh. Set to IMPLEMENTED when this template is complete.
  ImplementationStatus: IMPLEMENTED

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Project prefix for resource names.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC of the target group (NetworkStack.Outputs.VpcId).
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in two AZs (NetworkStack.Outputs.PublicSubnetIds).
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ALB security group (SecurityGroupsStack.Outputs.AlbSecurityGroupId).
  AppContainerPort:
    Type: Number
    MinValue: 1024
    MaxValue: 65535
    Description: Target group port (application container port).
  AppHealthCheckPath:
    Type: String
    AllowedPattern: "^/.*$"
    Description: Target group health check path.
  AlbCertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN; enables the HTTPS listener when set.

Conditions:
  HasCertificate: !Not [!Equals [!Ref AlbCertificateArn, ""]]
  HasNoCertificate: !Equals [!Ref AlbCertificateArn, ""]
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: !If [IsProd, "true", "false"]
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port: !Ref AppContainerPort
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: !Ref AppHealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Requests are short API calls; 30 s is enough to drain an instance and
        # keeps scale-in and instance refreshes quick.
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-app-tg

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasNoCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref AlbCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

# Consumed by main.yml via !GetAtt LoadBalancerStack.Outputs.<Name>.
Outputs:
  AlbArn:
    Description: Application Load Balancer ARN.
    Value: !Ref LoadBalancer
  AlbDnsName:
    Description: Public DNS name of the ALB.
    Value: !GetAtt LoadBalancer.DNSName
  AlbCanonicalHostedZoneId:
    Description: Route 53 hosted zone ID of the ALB (for alias records).
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
  AlbFullName:
    Description: ALB name in the form used by CloudWatch metric dimensions.
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  ListenerArn:
    Description: ARN of the active listener (HTTP 80 or HTTPS 443).
    Value: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
  TargetGroupArn:
    Description: Target group the Auto Scaling group registers instances in.
    Value: !Ref TargetGroup
  TargetGroupFullName:
    Description: Target group name in the form used by CloudWatch metric dimensions.
    Value: !GetAtt TargetGroup.TargetGroupFullName
