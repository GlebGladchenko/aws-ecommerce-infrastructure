AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  [PARTIAL - network and compute stages] AWS E-Commerce Infrastructure - root
  stack. Orchestrates the nested stacks that host the FastAPI application in
  app/. Deploy only via scripts/deploy.sh, which packages the nested templates
  to S3 and refuses to deploy a stage that includes a placeholder.

# -----------------------------------------------------------------------------
# Conventions (see docs/architecture.md)
#   Stack name     : <ProjectName>-<Environment>              e.g. ecommerce-dev
#   Resource names : <ProjectName>-<Environment>-<component>  e.g. ecommerce-dev-alb
#   Tags           : Project, Environment, Owner, CostCenter, ManagedBy, Repository
#                    are applied as stack-level tags by scripts/deploy.sh and
#                    propagate to every nested stack and supported resource.
#                    Each nested stack adds its own Component tag below.
#   Cross-stack    : values flow between nested stacks via !GetAtt
#                    <Stack>.Outputs.<Name>; no global Exports are used, so
#                    environments cannot accidentally couple to each other.
#   Stages         : each stage includes the previous one.
#                      network  NetworkStack, SecurityGroupsStack
#                      compute  + stacks marked `Condition: HasCompute`
#                               (endpoints, IAM, ALB, launch template, ASG)
#                      full     + stacks marked `Condition: IsFullDeployment`
#                    Keep this in sync with NETWORK_STAGE_TEMPLATES and
#                    COMPUTE_STAGE_TEMPLATES in scripts/deploy.sh.
#   ECR            : the repository (storage/ecr.yml) is a separate stack,
#                    <stack>-ecr, deployed once before any image is pushed. It
#                    is not nested here: the image must exist before the
#                    compute stage can start, and deleting this stack must not
#                    delete the images. Its name follows the convention
#                    <ProjectName>-<Environment>-api.
#   WAF            : a CloudFront-scoped web ACL can only be created in
#                    us-east-1, so networking/waf.yml is not nested here.
#                    scripts/deploy.sh deploys it as <stack>-waf in us-east-1
#                    (full stage only) and passes its ARN in as WebAclArn.
# -----------------------------------------------------------------------------

Metadata:
  # Describes the full stage. scripts/deploy.sh checks it only for
  # DeploymentStage=full; the network stage checks just the templates it
  # creates. Change to IMPLEMENTED once every nested stack is implemented and
  # the TODO wiring below is enabled.
  ImplementationStatus: PLACEHOLDER
  cfn-lint:
    config:
      ignore_checks:
        - W3002 # Local TemplateURL paths are intentional: deploy.sh runs `aws cloudformation package`
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General
        Parameters:
          - DeploymentStage
          - ProjectName
          - Environment
      - Label:
          default: Network
        Parameters:
          - VpcCidr
          - NatGatewayMode
          - AvailabilityZoneA
          - AvailabilityZoneB
      - Label:
          default: Application compute
        Parameters:
          - AppImageReference
          - AppAmiId
          - AppInstanceType
          - AppContainerPort
          - AppHealthCheckPath
          - AsgMinSize
          - AsgMaxSize
          - AsgDesiredCapacity
          - AlbCertificateArn
          - AlbTestIngressCidr
          - VpcEndpointAzMode
          - EnableSessionManager
      - Label:
          default: Database
        Parameters:
          - DbInstanceClass
          - DbAllocatedStorage
          - DbMultiAz
          - DbBackupRetentionDays
      - Label:
          default: Monitoring
        Parameters:
          - AlarmEmail
          - LogRetentionDays
      - Label:
          default: Edge
        Parameters:
          - WebAclArn

Parameters:
  DeploymentStage:
    Type: String
    Default: full
    AllowedValues:
      - network
      - compute
      - full
    Description: >-
      'network' = VPC and security groups only; 'compute' = network plus VPC
      endpoints, IAM, ALB, launch template and Auto Scaling group; 'full' =
      every stack. Set by scripts/deploy.sh --stage.

  ProjectName:
    Type: String
    Default: ecommerce
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    ConstraintDescription: 2-20 chars, lowercase letters, digits and hyphens, starting with a letter.
    Description: Short project identifier used as the prefix of every resource name.

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment.

  VpcCidr:
    Type: String
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/16$"
    ConstraintDescription: Must be an IPv4 /16 CIDR block, e.g. 10.10.0.0/16.
    Description: VPC CIDR block (/16). Use non-overlapping ranges per environment.

  NatGatewayMode:
    Type: String
    Default: per-az
    AllowedValues:
      - none
      - single
      - per-az
    Description: >-
      'none' = no NAT Gateways (lowest cost, no NAT-based internet access);
      'single' = one NAT Gateway (lower cost, AZ-level single point of failure);
      'per-az' = one NAT Gateway per AZ (high availability).

  # Set explicitly rather than derived with !GetAZs, which returns only AZs
  # that have a default subnet and so may return fewer than two.
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First Availability Zone; must be in the deployment region.

  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second Availability Zone; must differ from AvailabilityZoneA.

  AppImageReference:
    Type: String
    Default: ""
    AllowedPattern: "^$|^sha256:[a-f0-9]{64}$|^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$"
    ConstraintDescription: Must be an image digest (sha256:<64 hex>) or an image tag.
    Description: >-
      Application image in the <ProjectName>-<Environment>-api ECR repository:
      a digest (sha256:..., preferred) or an immutable tag (git SHA). Passed
      by scripts/deploy.sh --image; required for the compute and full stages.

  AppAmiId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^ami-[0-9a-f]{8,17}$"
    ConstraintDescription: Must be an AMI ID (ami-...).
    Description: >-
      x86_64 AMI for the application instances. Pinned by scripts/deploy.sh
      (resolved once from the AL2023 SSM parameter, changed only with --ami),
      so a new AMI release never rolls the instances during an unrelated
      deployment.

  AppInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for application hosts.

  AppContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1024
    MaxValue: 65535
    Description: >-
      Port the FastAPI container listens on (non-privileged); app/Dockerfile
      defaults to 8080. Used by the security groups and the ALB target group,
      independently of the ALB listener port.

  AppHealthCheckPath:
    Type: String
    Default: /health
    Description: HTTP path the ALB target group uses for health checks.

  AsgMinSize:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Minimum number of application instances.

  AsgMaxSize:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Maximum number of application instances.

  AsgDesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Initial desired number of application instances.

  AlbCertificateArn:
    Type: String
    Default: ""
    Description: >-
      Optional ACM certificate ARN for the ALB HTTPS listener. Leave empty
      until a domain is configured.

  AlbTestIngressCidr:
    Type: String
    Default: ""
    Description: >-
      Optional IPv4 CIDR (your /32) allowed to reach the ALB directly while
      CloudFront does not exist yet. Pass with scripts/deploy.sh --param; never
      commit it.

  VpcEndpointAzMode:
    Type: String
    Default: per-az
    AllowedValues:
      - single
      - per-az
    Description: >-
      Interface VPC endpoints in AZ a only ('single', half the cost) or in both
      AZs ('per-az', no cross-AZ dependency).

  EnableSessionManager:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Grant the instances Session Manager access and create the ssm and
      ssmmessages endpoints (2 extra interface endpoints).

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t4g.small
      - db.t4g.medium
    Description: RDS PostgreSQL instance class.

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Initial RDS storage in GiB (gp3).

  DbMultiAz:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Run RDS as a Multi-AZ deployment (synchronous standby in a second AZ).

  DbBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Days to retain automated RDS backups.

  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to the alarm SNS topic.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch Logs retention period in days.

  WebAclArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:wafv2:us-east-1:\\d{12}:global/webacl/.+$"
    ConstraintDescription: Must be a CloudFront-scoped (global, us-east-1) WAFv2 web ACL ARN.
    Description: >-
      WebAclArn output of the <stack>-waf stack in us-east-1. Passed by
      scripts/deploy.sh; required for the full stage.

Rules:
  ComputeStageRequiresImage:
    RuleCondition: !Not [!Equals [!Ref DeploymentStage, network]]
    Assertions:
      - Assert: !Not [!Equals [!Ref AppImageReference, ""]]
        AssertDescription: >-
          The compute and full stages need AppImageReference (pass
          scripts/deploy.sh --image <digest-or-tag>).
      - Assert: !Not [!Equals [!Ref AppAmiId, ""]]
        AssertDescription: >-
          The compute and full stages need AppAmiId (scripts/deploy.sh pins it).

  FullStageRequiresWebAcl:
    RuleCondition: !Equals [!Ref DeploymentStage, full]
    Assertions:
      - Assert: !Not [!Equals [!Ref WebAclArn, ""]]
        AssertDescription: >-
          DeploymentStage=full needs WebAclArn from the us-east-1 WAF stack
          (scripts/deploy.sh deploys it and passes the ARN).

Conditions:
  # The ALB serves HTTPS only once a certificate is supplied.
  HasAlbCertificate: !Not [!Equals [!Ref AlbCertificateArn, ""]]
  # Stacks of the compute stage (also part of the full stage).
  HasCompute: !Not [!Equals [!Ref DeploymentStage, network]]
  # Stacks of the full stage only.
  IsFullDeployment: !Equals [!Ref DeploymentStage, full]

# Nested stacks are grouped by layer. Until the child templates
# expose real Outputs, ordering is expressed with DependsOn. When a child is
# implemented, uncomment its TODO parameters (which use !GetAtt and make the
# dependency implicit) and drop the matching DependsOn entries.
# A compute-stage stack must not depend on (DependsOn or !GetAtt) a full-stage
# stack, which does not exist in the compute stage: wire such values with
# !If [IsFullDeployment, !GetAtt ..., !Ref AWS::NoValue] instead.
Resources:
  # --- Foundation -------------------------------------------------------------
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./network/vpc.yml
      TimeoutInMinutes: 30
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        NatGatewayMode: !Ref NatGatewayMode
        AvailabilityZoneA: !Ref AvailabilityZoneA
        AvailabilityZoneB: !Ref AvailabilityZoneB
        LogRetentionDays: !Ref LogRetentionDays
      Tags:
        - Key: Component
          Value: network

  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./network/security-groups.yml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        AppContainerPort: !Ref AppContainerPort
        AlbIngressPort: !If [HasAlbCertificate, 443, 80]
        AlbTestIngressCidr: !Ref AlbTestIngressCidr
      Tags:
        - Key: Component
          Value: security-groups

  AlertingStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFullDeployment
    Properties:
      TemplateURL: ./monitoring/sns.yml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        AlarmEmail: !Ref AlarmEmail
      Tags:
        - Key: Component
          Value: alerting

  # --- Security & storage -----------------------------------------------------
  SecretsStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFullDeployment
    Properties:
      TemplateURL: ./security/secrets.yml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
      Tags:
        - Key: Component
          Value: secrets

  StorageStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFullDeployment
    Properties:
      TemplateURL: ./storage/s3.yml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
      Tags:
        - Key: Component
          Value: storage

  IamStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasCompute
    Properties:
      TemplateURL: ./security/iam.yml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        AppRepositoryName: !Sub ${ProjectName}-${Environment}-api
        AppLogGroupName: !Sub /${ProjectName}/${Environment}/app
        AutoScalingGroupName: !Sub ${ProjectName}-${Environment}-app-asg
        EnableSessionManager: !Ref EnableSessionManager
        # TODO (full stage, via !If [IsFullDeployment, ...]):
        #   AppSecretArn:       !GetAtt SecretsStack.Outputs.AppSecretArn
        #   AssetsBucketArn:    !GetAtt StorageStack.Outputs.AssetsBucketArn
        #   DbMasterSecretArn:  !GetAtt DatabaseStack.Outputs.MasterUserSecretArn
      Tags:
        - Key: Component
          Value: iam

  # --- Data -------------------------------------------------------------------
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFullDeployment
    DependsOn:
      - NetworkStack
      - SecurityGroupsStack
    Properties:
      TemplateURL: ./database/rds.yml
      TimeoutInMinutes: 60
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        DbInstanceClass: !Ref DbInstanceClass
        DbAllocatedStorage: !Ref DbAllocatedStorage
        DbMultiAz: !Ref DbMultiAz
        DbBackupRetentionDays: !Ref DbBackupRetentionDays
        # TODO: DataSubnetIds:          !GetAtt NetworkStack.Outputs.DataSubnetIds
        # TODO: DbSecurityGroupId:      !GetAtt SecurityGroupsStack.Outputs.DbSecurityGroupId
      Tags:
        - Key: Component
          Value: database

  # --- Compute ----------------------------------------------------------------
  # Private connectivity to ECR, CloudWatch Logs and SSM for the app subnets,
  # which have no NAT route when NatGatewayMode=none.
  EndpointsStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasCompute
    Properties:
      TemplateURL: ./network/endpoints.yml
      TimeoutInMinutes: 20
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        AppSubnetIds: !GetAtt NetworkStack.Outputs.AppSubnetIds
        AppSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.AppSecurityGroupId
        EndpointAzMode: !Ref VpcEndpointAzMode
        EnableSessionManager: !Ref EnableSessionManager
      Tags:
        - Key: Component
          Value: vpc-endpoints

  LoadBalancerStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasCompute
    Properties:
      TemplateURL: ./compute/alb.yml
      TimeoutInMinutes: 20
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        AlbSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.AlbSecurityGroupId
        AppContainerPort: !Ref AppContainerPort
        AppHealthCheckPath: !Ref AppHealthCheckPath
        AlbCertificateArn: !Ref AlbCertificateArn
        # TODO (full stage): AccessLogsBucketName:
        #   !If [IsFullDeployment, !GetAtt StorageStack.Outputs.LogsBucketName, !Ref AWS::NoValue]
      Tags:
        - Key: Component
          Value: load-balancer

  LaunchTemplateStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasCompute
    Properties:
      TemplateURL: ./compute/ec2.yml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        AppInstanceType: !Ref AppInstanceType
        AppContainerPort: !Ref AppContainerPort
        LogRetentionDays: !Ref LogRetentionDays
        AppSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.AppSecurityGroupId
        InstanceProfileArn: !GetAtt IamStack.Outputs.AppInstanceProfileArn
        AppRepositoryName: !Sub ${ProjectName}-${Environment}-api
        AppImageReference: !Ref AppImageReference
        AppAmiId: !Ref AppAmiId
        VpcCidr: !GetAtt NetworkStack.Outputs.VpcCidr
        AppLogGroupName: !Sub /${ProjectName}/${Environment}/app
        AutoScalingGroupName: !Sub ${ProjectName}-${Environment}-app-asg
        AppReadyHookName: app-ready
        # TODO (full stage, via !If [IsFullDeployment, ...]):
        #   AppSecretArn:       !GetAtt SecretsStack.Outputs.AppSecretArn
        #   DbMasterSecretArn:  !GetAtt DatabaseStack.Outputs.MasterUserSecretArn
        #   DbEndpointAddress:  !GetAtt DatabaseStack.Outputs.EndpointAddress
      Tags:
        - Key: Component
          Value: launch-template

  # DependsOn EndpointsStack: instances need the endpoints during first boot
  # (docker login, pull, logs, readiness hook), and nothing else orders the
  # two stacks. A new launch template version (image or AMI change) triggers
  # a CloudFormation-managed instance refresh (UpdatePolicy in autoscaling.yml).
  AutoScalingStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasCompute
    DependsOn:
      - EndpointsStack
    Properties:
      TemplateURL: ./compute/autoscaling.yml
      TimeoutInMinutes: 30
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        AsgMinSize: !Ref AsgMinSize
        AsgMaxSize: !Ref AsgMaxSize
        AsgDesiredCapacity: !Ref AsgDesiredCapacity
        AutoScalingGroupName: !Sub ${ProjectName}-${Environment}-app-asg
        AppReadyHookName: app-ready
        AppSubnetIds: !GetAtt NetworkStack.Outputs.AppSubnetIds
        LaunchTemplateId: !GetAtt LaunchTemplateStack.Outputs.LaunchTemplateId
        LaunchTemplateVersion: !GetAtt LaunchTemplateStack.Outputs.LaunchTemplateLatestVersion
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.TargetGroupArn
        TargetGroupFullName: !GetAtt LoadBalancerStack.Outputs.TargetGroupFullName
        AlbFullName: !GetAtt LoadBalancerStack.Outputs.AlbFullName
      Tags:
        - Key: Component
          Value: autoscaling

  # --- Edge -------------------------------------------------------------------
  CdnStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFullDeployment
    DependsOn:
      - LoadBalancerStack
      - StorageStack
    Properties:
      TemplateURL: ./networking/cloudfront.yml
      TimeoutInMinutes: 45
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        # TODO: AlbDnsName:             !GetAtt LoadBalancerStack.Outputs.AlbDnsName
        # TODO: AssetsBucketName:       !GetAtt StorageStack.Outputs.AssetsBucketName
        # TODO: AssetsBucketRegionalDomainName: !GetAtt StorageStack.Outputs.AssetsBucketRegionalDomainName
        # TODO: LogsBucketName:         !GetAtt StorageStack.Outputs.LogsBucketName
        # TODO: WebAclArn:              !Ref WebAclArn
      Tags:
        - Key: Component
          Value: cdn

  # --- Observability ----------------------------------------------------------
  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFullDeployment
    DependsOn:
      - AlertingStack
      - LoadBalancerStack
      - AutoScalingStack
      - DatabaseStack
    Properties:
      TemplateURL: ./monitoring/cloudwatch.yml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        LogRetentionDays: !Ref LogRetentionDays
        # TODO: AlarmTopicArn:          !GetAtt AlertingStack.Outputs.AlarmTopicArn
        # TODO: AlbFullName:            !GetAtt LoadBalancerStack.Outputs.AlbFullName
        # TODO: TargetGroupFullName:    !GetAtt LoadBalancerStack.Outputs.TargetGroupFullName
        # TODO: AutoScalingGroupName:   !GetAtt AutoScalingStack.Outputs.AutoScalingGroupName
        # TODO: DbInstanceIdentifier:   !GetAtt DatabaseStack.Outputs.DbInstanceIdentifier
      Tags:
        - Key: Component
          Value: monitoring

# TODO (full stage): ApplicationUrl from CdnStack.Outputs.DistributionDomainName
Outputs:
  StackEnvironment:
    Description: Environment this root stack was deployed for.
    Value: !Ref Environment
  DeploymentStage:
    Description: Stage this root stack was deployed with (network or full).
    Value: !Ref DeploymentStage
  VpcId:
    Description: VPC ID from the network stack.
    Value: !GetAtt NetworkStack.Outputs.VpcId
  VpcCidr:
    Description: VPC CIDR block from the network stack.
    Value: !GetAtt NetworkStack.Outputs.VpcCidr
  AlbDnsName:
    Condition: HasCompute
    Description: Public DNS name of the ALB.
    Value: !GetAtt LoadBalancerStack.Outputs.AlbDnsName
  AlbUrl:
    Condition: HasCompute
    Description: Direct ALB URL (reachable only from CloudFront or AlbTestIngressCidr).
    Value: !Sub
      - "${Scheme}://${DnsName}"
      - Scheme: !If [HasAlbCertificate, https, http]
        DnsName: !GetAtt LoadBalancerStack.Outputs.AlbDnsName
  AlbArn:
    Condition: HasCompute
    Description: Application Load Balancer ARN.
    Value: !GetAtt LoadBalancerStack.Outputs.AlbArn
  TargetGroupArn:
    Condition: HasCompute
    Description: ALB target group ARN.
    Value: !GetAtt LoadBalancerStack.Outputs.TargetGroupArn
  AutoScalingGroupName:
    Condition: HasCompute
    Description: Application Auto Scaling group name.
    Value: !GetAtt AutoScalingStack.Outputs.AutoScalingGroupName
  AppLogGroupName:
    Condition: HasCompute
    Description: CloudWatch Logs group with the container output.
    Value: !GetAtt LaunchTemplateStack.Outputs.AppLogGroupName
  AppImageReference:
    Condition: HasCompute
    Description: Image digest or tag the launch template runs.
    Value: !Ref AppImageReference
  AppAmiId:
    Condition: HasCompute
    Description: AMI the launch template uses.
    Value: !Ref AppAmiId
