AWSTemplateFormatVersion: "2010-09-09"
# Required for Fn::If in DeletionPolicy / UpdateReplacePolicy; the root stack
# must be deployed with CAPABILITY_AUTO_EXPAND (scripts/deploy.sh does this).
Transform: AWS::LanguageExtensions
Description: >-
  AWS E-Commerce Infrastructure - Amazon ECR
  repository for the FastAPI application image built from app/.

# Repository <project>-<env>-api
#   - Tags are immutable: images are pushed once, tagged with the git SHA (never
#     `latest`, which would fail on the second push).
#   - Encryption is AES256 (ECR-managed). Changing it later replaces the
#     repository, which fails because the name is fixed - decide before deploy.
#   - prod is retained on stack deletion; dev is emptied and deleted with the
#     stack, so it can be torn down and redeployed without a name clash.
#   - No repository policy: pull access comes from the instance role (iam.yml),
#     push access from a GitHub OIDC role for app CI.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Project prefix for resource names.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.
  UntaggedImageExpiryDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: Days after which untagged images (e.g. failed pushes) are expired.
  MaxImageCount:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Number of most recent images kept; older ones are expired.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  AppRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      RepositoryName: !Sub ${ProjectName}-${Environment}-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: !If [IsProd, false, true]
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after ${UntaggedImageExpiryDays} days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": ${UntaggedImageExpiryDays}
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last ${MaxImageCount} images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${MaxImageCount}
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Description: Full ECR repository URI
    Value: !GetAtt AppRepository.RepositoryUri
  RepositoryArn:
    Description: ECR repository ARN
    Value: !GetAtt AppRepository.Arn
  RepositoryName:
    Description: ECR repository name
    Value: !Ref AppRepository
