AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  [PLACEHOLDER - NOT DEPLOYABLE] AWS E-Commerce Infrastructure - Amazon ECR
  repository for the FastAPI application image built from app/.

Metadata:
  ImplementationStatus: PLACEHOLDER
  cfn-lint:
    config:
      ignore_checks:
        - W2001 # TODO: remove once real resources consume the parameters

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Project prefix for resource names.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.

