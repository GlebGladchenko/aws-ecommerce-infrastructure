AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  [PLACEHOLDER - NOT DEPLOYABLE] AWS E-Commerce Infrastructure - application
  secrets in AWS Secrets Manager, encrypted with a customer managed KMS key.

Metadata:
  ImplementationStatus: PLACEHOLDER
  cfn-lint:
    config:
      ignore_checks:
        - W2001 # TODO: remove once real resources consume the parameters

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Project prefix for resource names.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.

# TODO: Planned resources
#   SecretsKmsKey + alias   alias/<project>-<env>-secrets, EnableKeyRotation: true
#   AppSecret               <project>/<env>/app
#     GenerateSecretString  (e.g. JWT signing key) - values are generated by AWS,
#                           never written to this repository or parameter files
#   CloudFrontOriginSecret  shared header value proving requests came via CloudFront
#
# The database master credential is NOT defined here: RDS creates and rotates it
# (ManageMasterUserPassword in database/rds.yml).
Resources:
  PlaceholderResource:
    Type: AWS::CloudFormation::WaitConditionHandle

# TODO: Planned outputs
#   AppSecretArn, OriginVerifySecretArn, SecretsKmsKeyArn
